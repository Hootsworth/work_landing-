<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singulr - Employee Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #faf9f6; --text-color: #1a1a1a;
            --accent-1: #ff90e8; --accent-2: #ffc900; --accent-3: #90e8ff; --accent-4: #c9ff90;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); --smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; min-height: 100vh; }

        /* Cursor */
        .cursor-dot, .cursor-outline { position: fixed; top: 0; left: 0; border-radius: 50%; z-index: 9999; pointer-events: none; opacity: 0; will-change: transform, width, height; }
        .cursor-dot { width: 8px; height: 8px; background-color: var(--text-color); transition: border-radius 0.2s, height 0.2s, width 0.2s; }
        .cursor-outline { width: 40px; height: 40px; border: 2px solid var(--text-color); transition: width 0.3s var(--spring), height 0.3s var(--spring), background-color 0.3s ease, border-radius 0.3s; }
        body.text-hover .cursor-dot { height: 24px; width: 2px; border-radius: 0; background-color: var(--accent-1); }
        body.text-hover .cursor-outline { opacity: 0 !important; }

        h1, h2, h3, h4 { font-weight: 800; letter-spacing: -1px; }

        /* Utilities */
        .btn { padding: 1rem 2rem; font-size: 1.1rem; font-weight: 800; font-family: inherit; border-radius: 50px; transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring); border: 2px solid var(--text-color); background: var(--text-color); color: var(--bg-color); display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.15); background: var(--accent-4); color: var(--text-color); }
        .huge-input { width: 100%; background: transparent; border: none; border-bottom: 3px solid rgba(0,0,0,0.1); font-family: 'Outfit', sans-serif; font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 600; color: var(--text-color); padding: 1rem 0; outline: none; transition: border-color 0.4s var(--spring); }
        .huge-input:focus { border-color: var(--accent-1); }
        .bento-card { background: #fff; border-radius: 30px; padding: 2.5rem; border: 2px solid rgba(0,0,0,0.04); box-shadow: 0 10px 30px rgba(0,0,0,0.02); transition: box-shadow 0.4s var(--spring), transform 0.5s var(--spring); position: relative; overflow: hidden; transform-style: preserve-3d; perspective: 1000px; }
        .bento-card:hover { box-shadow: 0 20px 50px rgba(0,0,0,0.08); transform: translateY(-5px); }

        /* Views */
        .app-view { display: none; opacity: 0; transition: opacity 0.4s var(--smooth); }
        .app-view.active { display: flex; opacity: 1; }
        #login-view { min-height: 100vh; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, var(--bg-color) 0%, #e8e6e1 100%); }
        .login-box { max-width: 500px; width: 90%; background: #fff; padding: 4rem; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .login-box h1 { font-size: 3rem; margin-bottom: 1rem; }
        
        #portal-shell { min-height: 100vh; flex-direction: row; }
        .sidebar { width: 280px; background: var(--text-color); color: var(--bg-color); padding: 3rem 2rem; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .sidebar .logo { font-size: 2rem; color: var(--bg-color); margin-bottom: 4rem; display: block; }
        .nav-menu { display: flex; flex-direction: column; gap: 1rem; flex-grow: 1; }
        .nav-item { padding: 1rem 1.5rem; border-radius: 20px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s var(--spring); opacity: 0.6; }
        .nav-item:hover { opacity: 1; background: rgba(255,255,255,0.1); transform: translateX(5px); }
        .nav-item.active { opacity: 1; background: var(--accent-1); color: var(--text-color); }
        .main-content { margin-left: 280px; width: calc(100% - 280px); padding: 4rem 5%; }
        
        /* Dashboard Layouts */
        .section-header { margin-bottom: 3rem; display: flex; justify-content: space-between; align-items: flex-end; }
        .section-header h2 { font-size: 3.5rem; line-height: 0.9; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .metric-card h3 { font-size: 1.2rem; opacity: 0.7; margin-bottom: 1rem; }
        .metric-card .value { font-size: 4rem; font-weight: 800; color: var(--accent-1); line-height: 1; }

        /* Tasks & Chat */
        .task-list { display: flex; flex-direction: column; gap: 1rem; }
        .task-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 1.5rem 2rem; border-radius: 20px; border: 2px solid transparent; transition: all 0.3s var(--spring); }
        .task-row:hover { border-color: rgba(0,0,0,0.1); transform: translateX(10px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .status-pill { padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .status-progress { background: var(--accent-2); }
        .status-review { background: var(--accent-3); }
        .status-done { background: var(--accent-4); }

        .chat-container { background: #fff; border-radius: 30px; height: 600px; display: flex; flex-direction: column; overflow: hidden; border: 2px solid rgba(0,0,0,0.05); }
        .chat-history { flex-grow: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .msg { max-width: 70%; padding: 1rem 1.5rem; border-radius: 20px; font-weight: 500; }
        .msg.received { background: var(--bg-color); align-self: flex-start; border-bottom-left-radius: 5px; }
        .msg.sent { background: var(--text-color); color: var(--bg-color); align-self: flex-end; border-bottom-right-radius: 5px; }
        .chat-input-area { padding: 1.5rem; border-top: 2px solid rgba(0,0,0,0.05); display: flex; gap: 1rem; }
        .chat-input { flex-grow: 1; border: none; background: var(--bg-color); padding: 1rem 1.5rem; border-radius: 50px; font-family: inherit; font-size: 1rem; outline: none; }

        .editor-container { max-width: 900px; }
        .editor-textarea { min-height: 400px; resize: none; font-size: 1.2rem; line-height: 1.8; margin-top: 2rem; }

        @media (max-width: 900px) {
            #portal-shell { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 1.5rem; flex-direction: row; align-items: center; justify-content: space-between; }
            .sidebar .logo { margin-bottom: 0; font-size: 1.5rem; }
            .nav-menu { display: none; }
            .main-content { margin-left: 0; width: 100%; padding: 2rem 5%; }
        }
        @media (hover: none) and (pointer: coarse) { * { cursor: auto !important; } .cursor-dot, .cursor-outline { display: none !important; } }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- LOGIN -->
    <div id="login-view" class="app-view active">
        <div class="login-box hover-target">
            <h1>Singulr<span style="color: var(--accent-1);">.</span> Hub</h1>
            <p>Authorized personnel only.</p>
            <form onsubmit="app.login(event)">
                <input id="emailInput" type="email" class="huge-input text-input" placeholder="agent@singulr.agency" style="margin-bottom: 2rem;" required>
                <input id="passwordInput" type="password" class="huge-input text-input" placeholder="Passcode" style="margin-bottom: 3rem;" required>
                <button type="submit" class="btn magnetic-btn" style="width: 100%;">Initialize ↗</button>
            </form>
        </div>
    </div>

    <!-- PORTAL -->
    <div id="portal-shell" class="app-view">
        <nav class="sidebar">
            <div class="logo">Singulr<span style="color: var(--accent-1);">.</span></div>
            <div class="nav-menu">
                <div class="nav-item hover-target active" onclick="app.navigate('dashboard', this)">Dashboard</div>
                <div class="nav-item hover-target" onclick="app.navigate('tasks', this)">Work Tracker</div>
                <div class="nav-item hover-target" onclick="app.navigate('messages', this)">Comm-Link</div>
                <div class="nav-item hover-target" onclick="app.navigate('blog', this)">Journal CMS</div>
            </div>
            <div class="nav-item hover-target" style="margin-top: auto; opacity: 0.5;" onclick="app.logout()">Log Out</div>
        </nav>

        <main class="main-content">
            
            <!-- Dashboard -->
            <div id="dashboard" class="content-section">
                <div class="section-header"><h2>System <br>Overview.</h2></div>
                <div class="dashboard-grid">
                    <div class="bento-card hover-target metric-card">
                        <h3>Published Journals</h3>
                        <div class="value" id="dash-blog-count">--</div>
                    </div>
                    <div class="bento-card hover-target metric-card">
                        <h3>Active Tasks</h3>
                        <div class="value" id="dash-task-count" style="color: var(--accent-2);">--</div>
                    </div>
                    <div class="bento-card hover-target metric-card">
                        <h3>System Status</h3>
                        <div class="value" style="color: var(--accent-4);">Live</div>
                    </div>
                </div>
            </div>

            <!-- Tasks -->
            <div id="tasks" class="content-section" style="display: none;">
                <div class="section-header">
                    <h2>Active <br>Sprints.</h2>
                    <button class="btn hover-target magnetic-btn" style="background: transparent; color: var(--text-color);" onclick="app.createDummyTask()">+ Add Task (Demo)</button>
                </div>
                <div class="task-list" id="task-container">
                    <p style="opacity:0.5;">Loading tasks...</p>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages" class="content-section" style="display: none;">
                <div class="section-header"><h2>Agency <br>Comm-Link.</h2></div>
                <div class="chat-container">
                    <div class="chat-history" id="chat-history">
                        <p style="opacity:0.5; text-align:center;">Loading messages...</p>
                    </div>
                    <form class="chat-input-area" onsubmit="app.sendMessage(event)">
                        <input id="chatInput" type="text" class="chat-input text-input" placeholder="Type a message..." required>
                        <button type="submit" class="btn magnetic-btn hover-target" style="padding: 1rem 1.5rem;">Send</button>
                    </form>
                </div>
            </div>

            <!-- Blog Editor -->
            <div id="blog" class="content-section" style="display: none;">
                <div class="section-header">
                    <h2>Draft <br>Journal.</h2>
                    <button class="btn hover-target magnetic-btn" onclick="app.publishBlog()">Publish to Live ↗</button>
                </div>
                <div class="editor-container">
                    <input id="blogTitle" type="text" class="huge-input text-input" placeholder="Article Title (Make it punchy)">
                    <input id="blogTags" type="text" class="huge-input text-input" placeholder="Tags (e.g. Engineering, Culture)" style="font-size: 1.5rem; border-color: transparent; opacity: 0.7;">
                    <textarea id="blogContent" class="huge-input text-input editor-textarea" placeholder="Start writing..."></textarea>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ==========================================
        // INSERT YOUR SUPABASE CREDENTIALS HERE
        // ==========================================
        const SUPABASE_URL = 'https://hrmcefpiysptevmqsuaw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhybWNlZnBpeXNwdGV2bXFzdWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMTc0ODAsImV4cCI6MjA5NTc5MzQ4MH0.4FOVriV8XW0X8y1kYtF5jpzg_Kugw276GDVOIi32X4o';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Core App Logic ---
        const app = {
            currentUserEmail: null,

            init: async () => {
                initCursor();
                
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    app.currentUserEmail = session.user.email;
                    document.getElementById('login-view').classList.remove('active');
                    document.getElementById('portal-shell').classList.add('active');
                    app.loadDashboardData();
                }
            },

            login: async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                
                const btn = e.target.querySelector('button');
                btn.innerText = "Authenticating...";

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    alert(error.message);
                    btn.innerText = "Initialize ↗";
                    return;
                }

                app.currentUserEmail = data.user.email;
                document.getElementById('login-view').classList.remove('active');
                setTimeout(() => {
                    document.getElementById('portal-shell').classList.add('active');
                    app.loadDashboardData();
                    rebindCursor();
                }, 400);
            },

            logout: async () => {
                await supabaseClient.auth.signOut();
                app.currentUserEmail = null;
                document.getElementById('portal-shell').classList.remove('active');
                setTimeout(() => {
                    document.getElementById('login-view').classList.add('active');
                }, 400);
            },

            navigate: (sectionId, navElement) => {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                navElement.classList.add('active');
                
                document.querySelectorAll('.content-section').forEach(el => { el.style.display = 'none'; el.style.opacity = 0; });
                const target = document.getElementById(sectionId);
                target.style.display = 'block';
                setTimeout(() => target.style.opacity = 1, 50);

                if (sectionId === 'tasks') app.loadTasks();
                if (sectionId === 'messages') app.loadMessages();
                if (sectionId === 'dashboard') app.loadDashboardData();
            },

            // --- Database Functions ---
            
            publishBlog: async () => {
                const title = document.getElementById('blogTitle').value;
                const tags = document.getElementById('blogTags').value;
                const content = document.getElementById('blogContent').value;

                if (!title || !content) return alert("Title and Content are required.");

                const { error } = await supabaseClient.from('blogs').insert([{ title, tags, content }]);

                if (error) {
                    alert(`Error: ${error.message}`);
                } else {
                    alert("Published! Check the live blogs page.");
                    document.getElementById('blogTitle').value = '';
                    document.getElementById('blogTags').value = '';
                    document.getElementById('blogContent').value = '';
                }
            },

            loadTasks: async () => {
                const { data: tasks, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: false });
                const container = document.getElementById('task-container');
                
                if (error || !tasks.length) {
                    container.innerHTML = `<p style="opacity:0.5;">No active tasks found.</p>`;
                    return;
                }

                container.innerHTML = tasks.map(task => `
                    <div class="task-row hover-target">
                        <div>
                            <h3 style="font-size: 1.5rem; margin-bottom: 0.2rem;">${task.title}</h3>
                            <p style="opacity: 0.6; font-size: 0.9rem;">${task.project}</p>
                        </div>
                        <span class="status-pill ${task.status === 'Merged' ? 'status-done' : task.status === 'In Review' ? 'status-review' : 'status-progress'}">${task.status}</span>
                    </div>
                `).join('');
                rebindCursor();
            },

            createDummyTask: async () => {
                await supabaseClient.from('tasks').insert([{ title: "New Feature Spec", project: "Client Build", status: "In Progress" }]);
                app.loadTasks();
            },

            loadMessages: async () => {
                const { data: messages, error } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
                const container = document.getElementById('chat-history');
                
                if (error || !messages.length) {
                    container.innerHTML = `<p style="opacity:0.5; text-align:center;">Comm-Link is quiet.</p>`;
                    return;
                }

                container.innerHTML = messages.map(msg => {
                    const isMine = msg.sender_email === app.currentUserEmail;
                    return `<div class="msg ${isMine ? 'sent' : 'received'}" title="${msg.sender_email}">${msg.message}</div>`;
                }).join('');
                container.scrollTop = container.scrollHeight;
            },

            sendMessage: async (e) => {
                e.preventDefault();
                const input = document.getElementById('chatInput');
                const message = input.value;
                if (!message) return;

                const { error } = await supabaseClient.from('messages').insert([{ sender_email: app.currentUserEmail, message }]);
                if (!error) {
                    input.value = '';
                    app.loadMessages();
                }
            },

            loadDashboardData: async () => {
                const { count: blogCount } = await supabaseClient.from('blogs').select('*', { count: 'exact', head: true });
                const { count: taskCount } = await supabaseClient.from('tasks').select('*', { count: 'exact', head: true });
                
                document.getElementById('dash-blog-count').innerText = (blogCount || 0).toString().padStart(2, '0');
                document.getElementById('dash-task-count').innerText = (taskCount || 0).toString().padStart(2, '0');
            }
        };

        // --- Interaction Engine ---
        let cursorDot, cursorOutline, mouseX, mouseY, outlineX, outlineY;
        function initCursor() {
            cursorDot = document.querySelector('.cursor-dot'); cursorOutline = document.querySelector('.cursor-outline');
            mouseX = window.innerWidth / 2; mouseY = window.innerHeight / 2; outlineX = mouseX; outlineY = mouseY;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX; mouseY = e.clientY; cursorDot.style.opacity = 1; cursorOutline.style.opacity = 1;
                cursorDot.style.transform = `translate(${mouseX - 4}px, ${mouseY - 4}px)`;
            });
            function animate() {
                outlineX += (mouseX - outlineX) * 0.15; outlineY += (mouseY - outlineY) * 0.15;
                cursorOutline.style.transform = `translate(${outlineX - 20}px, ${outlineY - 20}px)`;
                requestAnimationFrame(animate);
            }
            animate(); rebindCursor();
        }

        function rebindCursor() {
            document.querySelectorAll('.hover-target').forEach(t => { t.removeEventListener('mouseenter', handleMouseEnter); t.removeEventListener('mouseleave', handleMouseLeave); t.addEventListener('mouseenter', handleMouseEnter); t.addEventListener('mouseleave', handleMouseLeave); });
            document.querySelectorAll('.text-input').forEach(i => { i.addEventListener('mouseenter', () => document.body.classList.add('text-hover')); i.addEventListener('mouseleave', () => document.body.classList.remove('text-hover')); });
            document.querySelectorAll('.magnetic-btn').forEach(btn => {
                btn.addEventListener('mousemove', (e) => { const r = btn.getBoundingClientRect(); btn.style.transform = `translate(${(e.clientX - r.left - r.width/2) * 0.3}px, ${(e.clientY - r.top - r.height/2) * 0.4}px) scale(1.05)`; });
                btn.addEventListener('mouseleave', () => btn.style.transform = `translate(0px, 0px) scale(1)`);
            });
            document.querySelectorAll('.bento-card').forEach(card => {
                card.addEventListener('mousemove', (e) => { const r = card.getBoundingClientRect(); card.style.transform = `perspective(1000px) rotateX(${((e.clientY - r.top - r.height/2) / (r.height/2)) * -5}deg) rotateY(${((e.clientX - r.left - r.width/2) / (r.width/2)) * 5}deg) scale3d(1.02, 1.02, 1.02)`; });
                card.addEventListener('mouseleave', () => card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`);
            });
        }
        function handleMouseEnter(e) { cursorOutline.style.width = '70px'; cursorOutline.style.height = '70px'; cursorOutline.style.backgroundColor = e.target.closest('.sidebar') ? 'rgba(250, 249, 246, 0.15)' : 'rgba(26, 26, 26, 0.05)'; cursorOutline.style.borderColor = 'transparent'; }
        function handleMouseLeave(e) { cursorOutline.style.width = '40px'; cursorOutline.style.height = '40px'; cursorOutline.style.backgroundColor = 'transparent'; cursorOutline.style.borderColor = e.target.closest('.sidebar') ? 'var(--bg-color)' : 'var(--text-color)'; }

        // Start App
        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
